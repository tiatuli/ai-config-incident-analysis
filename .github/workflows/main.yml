name: Deployment Incident Demo

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy Application
        env:
          APP_NAME: "AI DevOps Application"
          APP_ENV: "production"
          PORT: "3000"
          DATABASE_URL: "mongodb://demo-database:27017/app"
        run: npm start
